# ==============================================================
# Nagios Core Configuration File: nagios.cfg
# Course: INT333 - DevOps Advanced Configuration Management
# University: Lovely Professional University
# ==============================================================

# Log file location
log_file=/var/log/nagios/nagios.log

# Object configuration files
cfg_file=/etc/nagios/objects/commands.cfg
cfg_file=/etc/nagios/objects/contacts.cfg
cfg_file=/etc/nagios/objects/timeperiods.cfg
cfg_file=/etc/nagios/objects/campus_server.cfg

# Object cache file
object_cache_file=/var/cache/nagios/objects.precache

# Pre-cached object file
precached_object_file=/var/cache/nagios/objects.precache

# Resource configuration file (macros like $USER1$)
resource_file=/etc/nagios/resource.cfg

# Status log file
status_file=/var/log/nagios/status.dat
status_update_interval=15

# Nagios User & Group
nagios_user=nagios
nagios_group=nagios

# Notification & Service Execution Parameters
enable_notifications=1
execute_service_checks=1
accept_passive_service_checks=1
execute_host_checks=1
accept_passive_host_checks=1

# Check intervals and timing
interval_length=60
check_for_updates=0
bare_update_checks=0
use_syslog=1
log_notifications=1
log_service_retries=1
log_host_retries=1
log_event_handlers=1
log_initial_states=1
log_external_commands=1
log_passive_checks=1

# Performance data logging
process_perf_data=1
host_perfdata_command=process-host-perfdata
service_perfdata_command=process-service-perfdata

