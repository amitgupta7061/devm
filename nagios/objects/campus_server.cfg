# ==============================================================
# Nagios Object Configuration: campus_server.cfg
# Host and Service Definitions for Smart Campus System
# Course: INT333 - DevOps Advanced Configuration Management
# ==============================================================

# --------------------------------------------------------------
# 1. Host Definition: Smart Campus Production Node
# --------------------------------------------------------------
define host {
    use                     linux-server
    host_name               campus-server
    alias                   Smart Campus Production Server (INT333)
    address                 127.0.0.1
    max_check_attempts      3
    check_interval          2
    retry_interval          1
    check_period            24x7
    notification_interval   60
    notification_period     24x7
    notification_options    d,u,r
    contact_groups          campus-admins
    check_command           check-host-alive
}

# --------------------------------------------------------------
# 2. Hostgroup Definition
# --------------------------------------------------------------
define hostgroup {
    hostgroup_name          campus-infrastructure
    alias                   Smart Campus DevOps Infrastructure
    members                 campus-server
}

# --------------------------------------------------------------
# 3. Service Checks
# --------------------------------------------------------------

# Service 1: PING / Network Latency
define service {
    use                     generic-service
    host_name               campus-server
    service_description     Network Latency (PING)
    check_command           check_ping!100.0,20%!500.0,60%
    notification_interval   60
}

# Service 2: HTTP Web Frontend Availability (Port 80 / Port 3000)
define service {
    use                     generic-service
    host_name               campus-server
    service_description     HTTP - Campus Web Frontend
    check_command           check_http_port!3000
    notification_interval   30
}

# Service 3: HTTP Backend API Healthcheck (/api/health)
define service {
    use                     generic-service
    host_name               campus-server
    service_description     HTTP - Backend API Healthcheck
    check_command           check_campus_api_health
    check_interval          1
    retry_interval          1
    notification_interval   15
}

# Service 4: TCP MongoDB Service (Port 27017)
define service {
    use                     generic-service
    host_name               campus-server
    service_description     TCP - MongoDB Database Service
    check_command           check_tcp_port!27017
    notification_interval   30
}

# Service 5: Root Partition Disk Space Usage
define service {
    use                     generic-service
    host_name               campus-server
    service_description     Disk - Root Filesystem Usage
    check_command           check_disk!20%!10%!/
    notification_interval   120
}

# Service 6: System CPU Load Average
define service {
    use                     generic-service
    host_name               campus-server
    service_description     CPU - System Load Average
    check_command           check_load!2.0,1.5,1.0!4.0,3.0,2.0
    notification_interval   60
}

# Service 7: Physical Memory Utilization
define service {
    use                     generic-service
    host_name               campus-server
    service_description     RAM - Physical Memory Usage
    check_command           check_memory!80%!90%
    notification_interval   60
}

# Service 8: Docker Daemon Service State
define service {
    use                     generic-service
    host_name               campus-server
    service_description     Process - Docker Engine Daemon
    check_command           check_procs!1:!1:!dockerd
    notification_interval   30
}

