# ==============================================================
# Nagios Command Definitions: commands.cfg
# Custom commands for Smart Campus Infrastructure Monitoring
# ==============================================================

# Command 1: Host Alive Check
define command {
    command_name    check-host-alive
    command_line    $USER1$/check_ping -H $HOSTADDRESS$ -w 3000.0,80% -c 5000.0,100% -p 5
}

# Command 2: HTTP Port Check
define command {
    command_name    check_http_port
    command_line    $USER1$/check_http -H $HOSTADDRESS$ -p $ARG1$ -t 10
}

# Command 3: Smart Campus API Healthcheck (validates JSON UP response and status code 200)
define command {
    command_name    check_campus_api_health
    command_line    $USER1$/check_http -H $HOSTADDRESS$ -p 5000 -u /api/health -e 200 -s '"status":"UP"'
}

# Command 4: Custom Bash Health Check Plugin
define command {
    command_name    check_campus_custom_plugin
    command_line    /etc/nagios/plugins/check_campus_health.sh -H $HOSTADDRESS$ -p 5000
}

# Command 5: TCP Port Check (MongoDB)
define command {
    command_name    check_tcp_port
    command_line    $USER1$/check_tcp -H $HOSTADDRESS$ -p $ARG1$ -t 10
}

# Command 6: Disk Space Usage Check
define command {
    command_name    check_disk
    command_line    $USER1$/check_disk -w $ARG1$ -c $ARG2$ -p $ARG3$
}

# Command 7: CPU Load Average Check
define command {
    command_name    check_load
    command_line    $USER1$/check_load -r -w $ARG1$ -c $ARG2$
}

# Command 8: Process State Check (Docker)
define command {
    command_name    check_procs
    command_line    $USER1$/check_procs -w $ARG1$ -c $ARG2$ -a $ARG3$
}

# Command 9: Memory Usage Check
define command {
    command_name    check_memory
    command_line    $USER1$/check_mem -w $ARG1$ -c $ARG2$
}

